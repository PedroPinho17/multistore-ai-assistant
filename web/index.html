<div id="app" v-cloak style="height:100%">
  <home-page v-if="view === 'home'"></home-page>
  <login-page v-else-if="view === 'login'"></login-page>
  <app-shell v-else-if="view && user"></app-shell>

  <!-- Diálogo de confirmação (substitui a janela de confirmação do browser) -->
  <transition name="dlg">
    <div v-if="dialog" class="dlg-backdrop" @mousedown.self="closeDialog(false)">
      <div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-text"
           @keydown="dialogKey">
        <div class="dlg-icon" :class="{ danger: dialog.danger }" aria-hidden="true">
          <svg v-if="dialog.danger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
          <svg v-else viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        </div>
        <h2 id="dlg-title">{{ dialog.title }}</h2>
        <p id="dlg-text"><strong v-if="dialog.subject">«{{ dialog.subject }}»</strong><br v-if="dialog.subject">{{ dialog.text }}</p>
        <div class="dlg-actions">
          <button type="button" ref="dlgCancel" class="dlg-cancel" @click="closeDialog(false)">{{ t.dlg.cancel }}</button>
          <button type="button" ref="dlgOk" :class="dialog.danger ? 'dlg-danger' : 'dlg-ok'"
                  @click="closeDialog(true)">{{ dialog.confirm }}</button>
        </div>
      </div>
    </div>
  </transition>

  <!-- Notificações (substituem os alertas do browser) -->
  <div class="toasts" aria-live="polite">
    <transition-group name="toast">
      <div v-for="x in toasts" :key="x.id" class="toast" :class="x.type" :role="x.type === 'error' ? 'alert' : 'status'">
        <span class="toast-dot" aria-hidden="true">{{ x.type === "error" ? "!" : "✓" }}</span>
        <span class="toast-text">{{ x.text }}</span>
        <button type="button" class="toast-x" :aria-label="t.dlg.close" @click="dismissToast(x.id)">×</button>
      </div>
    </transition-group>
  </div>
</div>
