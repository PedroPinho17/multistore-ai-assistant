# Avaliação automática do text-to-SQL, a pedido (Actions → eval → Run workflow).
#
# Sobe a aplicação completa com Docker (BD gerada do zero + exemplos RAG),
# corre eval/questions.json contra o LLM e guarda o resultado com data:
#   - artefacto "eval-results" (JSON por corrida + history.csv)
#   - resumo na página da execução
# Precisa do segredo GROQ_API_KEY (Settings → Secrets and variables → Actions).
name: eval

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Corridas por pergunta (o LLM nem sempre gera o mesmo SQL)"
        default: "1"
      level:
        description: "Só um nível (easy, medium, hard, refusal); vazio = todos"
        default: ""

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Criar .env efémero
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_FALLBACK: ${{ secrets.GROQ_API_KEY_FALLBACK }}   # opcional: usada quando a quota da principal acaba
          LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gpt-oss-120b' }}
        run: |
          test -n "$GROQ_API_KEY" || { echo "Falta o segredo GROQ_API_KEY"; exit 1; }
          PG=$(openssl rand -hex 16); RO=$(openssl rand -hex 16)
          cat > .env <<ENV
          POSTGRES_PASSWORD=$PG
          DATABASE_URL=postgresql://multistore:$PG@localhost:5433/multistore
          READONLY_DATABASE_URL=postgresql://assistente:$RO@localhost:5433/multistore
          GROQ_API_KEY=$GROQ_API_KEY
          GROQ_API_KEY_FALLBACK=$GROQ_API_KEY_FALLBACK
          LLM_BASE_URL=https://api.groq.com/openai/v1
          LLM_MODEL=$LLM_MODEL
          JWT_SECRET=$(openssl rand -hex 32)
          INTENT_MODEL=minilm
          APP_PORT=8001
          ENV

      - name: Subir a aplicação (gera a BD, índices e exemplos RAG)
        run: |
          # o contentor corre com um utilizador sem privilégios: tem de poder escrever em eval/results
          mkdir -p eval/results models && chmod -R a+rwX eval models
          docker compose up -d --build
          for i in $(seq 1 120); do
            curl -sf http://localhost:8001/health && exit 0
            sleep 15
          done
          docker compose logs app; exit 1

      - name: Avaliar
        env:
          RUNS: ${{ inputs.runs }}
          LEVEL: ${{ inputs.level }}
        # "docker compose exec" abre um processo novo, sem a troca localhost:5433 -> db:5432
        # que o entrypoint faz para a API: aplica-se aqui a mesma troca.
        run: |
          docker compose exec -T -e RUNS="$RUNS" -e LEVEL="$LEVEL" app sh -c '
            to_docker_host() { echo "$1" | sed -E "s#@[^/@]+/#@db:5432/#"; }
            export DATABASE_URL="$(to_docker_host "$DATABASE_URL")"
            export READONLY_DATABASE_URL="$(to_docker_host "$READONLY_DATABASE_URL")"
            exec python -m multistore_ai_assistant.evaluate "$RUNS" $LEVEL'

      - name: Resumo
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          files = sorted(pathlib.Path("eval/results").glob("*.json"))
          if not files:
              print("Sem resultados."); raise SystemExit
          r = json.loads(files[-1].read_text(encoding="utf-8"))
          print(f"## Text-to-SQL · {r['model']}\n")
          print(f"**Execution accuracy:** {100 * (r['accuracy'] or 0):.1f} % ({r['hits']}/{r['total']}, {r['runs']} corrida(s))\n")
          print("| Nível | Accuracy |\n|---|---|")
          for lvl, v in r["by_level"].items():
              print(f"| {lvl} | {100 * (v['accuracy'] or 0):.1f} % ({v['hits']}/{v['total']}) |")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            eval/results/
            eval/history.csv

      - name: Parar
        if: always()
        run: docker compose down -v
