# Lint e testes unitários em cada push / pull request (sem BD nem LLM: tudo simulado).
# Os testes de integração saltam sozinhos quando não há Postgres.
name: tests

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Typecheck (vue-tsc)
        run: npx vue-tsc -b --pretty false
      - name: Lint (eslint)
        run: npm run lint
      - name: Testes (vitest)
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: CSP — index.html sem scripts inline nem CDNs
        run: node scripts/check-csp-index.mjs
      - name: Chart.js fora do código de arranque (só carregado a pedido)
        run: node scripts/check-lazy-chunks.mjs
      - name: Línguas normalizadas (gen-locales.mjs; ficheiros gerados = fonte de verdade)
        run: |
          node scripts/gen-locales.mjs
          changed="$(git status --porcelain -- src/i18n/generated)"
          if [ -n "$changed" ]; then
            echo "::error::src/i18n/generated não está normalizado. Edita os ficheiros, corre 'npm run gen-locales' e faz commit:"
            echo "$changed"
            git --no-pager diff -- src/i18n/generated | head -50
            exit 1
          fi

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
      - name: Instalar dependências
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Testes unitários
        run: uv run pytest tests/unit -q
